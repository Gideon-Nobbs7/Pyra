[project]
name = "pyra-backend"
version = "0.1.0"
description = "Pyra backend: harmonized MODIS and VIIRS hotspot observations (M1 scaffold)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7",
  "pydantic-settings>=2.16",
  "psycopg[binary]>=3.2",
  "cachetools>=5.3",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "earthengine-api>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
