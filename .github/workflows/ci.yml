# Pyra CI.
#
# What runs when:
# - Pull requests to main: backend, frontend, and e2e checks. Jobs skip
#   gracefully until the scaffold lands (backend needs backend/pyproject.toml
#   or a backend/requirements*.txt; frontend needs frontend/package.json;
#   e2e needs frontend/playwright.config.*).
# - Push to main (including merged PRs): the same checks.
# - Manual: workflow_dispatch runs the checks.
#
# Branch protection: require the "CI result" check on main, no force-push.
# No secrets are committed. The pipeline uses only GITHUB_TOKEN.
# Building and deploying the demo image is a follow-up once the host is
# chosen; the human runs Docker.

name: Pyra CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/pyproject.toml', 'backend/requirements.txt', 'backend/requirements-dev.txt', 'backend/setup.py', 'backend/setup.cfg') != '' }}
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: pyra
          POSTGRES_PASSWORD: pyra
          POSTGRES_DB: pyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pyra"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://pyra:pyra@localhost:5432/pyra_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || pip install .; fi
          pip install pytest httpx ruff

      - name: Lint and format check
        working-directory: backend
        run: |
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || [ -f pyproject.toml ]; then
            ruff check .
            ruff format --check .
          else
            echo "No ruff config; skipping."
          fi

      - name: Typecheck
        working-directory: backend
        run: |
          if [ -f mypy.ini ] || [ -f .mypy.ini ] || grep -q "tool.mypy" pyproject.toml 2>/dev/null; then
            pip install mypy
            mypy .
          else
            echo "Mypy not configured; skipping."
          fi

      - name: Tests
        working-directory: backend
        run: |
          if [ -d tests ] || find . -maxdepth 3 \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest -q
          else
            echo "No tests found; skipping."
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm run test --if-present -- --run

      - name: Build
        run: npm run build --if-present

      - name: Bundle size
        run: npm run bundlesize --if-present

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ hashFiles('frontend/playwright.config.*') != '' }}
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: pyra
          POSTGRES_PASSWORD: pyra
          POSTGRES_DB: pyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pyra"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://pyra:pyra@localhost:5432/pyra_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || pip install .; fi
          pip install uvicorn

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Assumes the backend serves `uvicorn app.main:app` with GET /api/v1/health
      - name: Run end-to-end tests
        working-directory: frontend
        run: |
          (cd ../backend && uvicorn app.main:app --port 8000 >/tmp/uvicorn.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/health
          npm run test:e2e --if-present

  ci:
    name: CI result
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: always()
    steps:
      - name: Check results
        run: |
          for result in "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.e2e.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "CI failed (backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} e2e=${{ needs.e2e.result }})"
              exit 1
            fi
          done
          echo "CI passed (backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} e2e=${{ needs.e2e.result }})."
